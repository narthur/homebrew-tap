name: Update Formula

on:
  schedule:
    # Run every hour
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Check and update formula
        id: update
        run: |
          scripts/update-buzz-formula.sh
          # Check if formula was updated
          if ! git diff --exit-code Formula/buzz.rb > /dev/null; then
            echo "updated=true" >> $GITHUB_OUTPUT
            VERSION=$(grep -oP 'url.*tags/\K[^/]+(?=\.tar\.gz)' Formula/buzz.rb)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.update.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/buzz.rb
          git commit -m "buzz ${{ steps.update.outputs.version }}"
          git push
