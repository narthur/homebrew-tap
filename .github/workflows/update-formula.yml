name: Update Formula

on:
  schedule:
    # Run every hour
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Check and update formula
        id: update
        run: .github/scripts/update-formula.sh

      - name: Commit and push
        if: steps.update.outputs.updated == 'true'
        env:
          FORMULAS: ${{ steps.update.outputs.formulas }}
          VERSIONS: ${{ steps.update.outputs.versions }}
        run: .github/scripts/commit-and-push.sh
